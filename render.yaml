# Render deployment blueprint for the VoltIQ API (free tier).
# In Render: New > Blueprint > pick this GitHub repository. Render reads this
# file, creates the database and the API, and redeploys on every push to main.
# Then put the API's URL into the GitHub repository variable VITE_API_URL so
# the GitHub Pages web app talks to it (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: voltiq-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: every request reaches the app through Render's
    # proxy, so the client address must come from X-Forwarded-For, or every
    # user would share the proxy's address in the sign-in attempt limits
    # (app/core/rate_limit.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-analytics-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://w3-ai-lb.github.io,http://localhost:5173"
      # Demo deploy: fill the empty database with demo data on first start.
      # Set to "false" before any real customer data goes in.
      - key: SEED_DEMO_DATA_ON_EMPTY_DB
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: RETURN_RESET_TOKEN_IN_RESPONSE
        value: "false"          # never return reset tokens from a deployed API

  # A daily backup job (python -m scripts.backup) needs a paid Render plan
  # because it writes to a disk. Add it back when the product goes live:
  # see backend/scripts/backup.py.

databases:
  - name: energy-analytics-db
    databaseName: energy_analytics
    plan: free
