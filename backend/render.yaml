# Render deployment blueprint: matches Section X of the Software Architecture.
# Push to GitHub, then in Render: New > Blueprint > select this repo.
services:
  - type: web
    name: energy-analytics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: every request reaches the app through Render's
    # proxy, so the client address must come from X-Forwarded-For, or every
    # user would share the proxy's address in the sign-in attempt limits
    # (app/core/rate_limit.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-analytics-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # set this to your Vercel URL in the dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: RETURN_RESET_TOKEN_IN_RESPONSE
        value: "false"          # never return reset tokens from a deployed API

  # Daily database backup: SRS Section IV, Reliability.
  #
  # The disk matters: without it the dumps are written into the container
  # filesystem and disappear with it, which would satisfy the requirement on
  # paper and nowhere else.
  - type: cron
    name: energy-analytics-backup
    runtime: python
    rootDir: backend
    schedule: "0 2 * * *"          # 02:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.backup --out /var/data/backups --keep 7
    disk:
      name: backups
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-analytics-db
          property: connectionString

databases:
  - name: energy-analytics-db
    databaseName: energy_analytics
    plan: free
